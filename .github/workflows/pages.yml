name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, claude/time-tracking-app-windows-android-i5jbkq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-ponte:
    name: Test del ponte Revit su Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esegui i test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-ponte.ps1

  deploy:
    needs: test-ponte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html styles.css app.js report.js sync.js firebase-config.js sw.js manifest.webmanifest icons vendor _site/
          (cd ponte-revit && zip -q -X ../_site/ponte-revit.zip *)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
